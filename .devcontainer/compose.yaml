services:
  workspace:
    image: ghcr.io/hilmoo/containers/my-devcontainer:v0.4.0
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mycatatankuliah
    volumes:
      - my-catatan-kuliah-postgres:/var/lib/postgresql/18/docker
    network_mode: service:workspace
  nats:
    image: nats:2.12-alpine
    network_mode: service:workspace
    volumes:
      - my-catatan-kuliah-nats:/data
    command: -js -sd /data

  redis:
    image: redis:7-alpine
    network_mode: service:workspace
    volumes:
      - my-catatan-kuliah-redis:/data
    command: redis-server --appendonly yes

  ports:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    network_mode: service:workspace
    volumes:
      - my-catatan-kuliah-minio:/data

volumes:
  my-catatan-kuliah-postgres:
  my-catatan-kuliah-nats:
  my-catatan-kuliah-redis:
  my-catatan-kuliah-minio:

