services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mycatatankuliah
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d mycatatankuliah" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.12-alpine
    command: -js -sd /data
    volumes:
      - nats_data:/data

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  apps:
    image: ghcr.io/hilmoo/my-catatan-kuliah-apps
    ports:
      - "8080:8080"
    environment:
      DOMAIN: http://localhost:8080
      SECRET: <SECRET>
      GOOGLE_CLIENT_ID: <GOOGLE_CLIENT_ID>
      GOOGLE_CLIENT_SECRET: <GOOGLE_CLIENT_SECRET>
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET: mycatatankuliah
      DATABASE_URL: postgres://postgres:postgres@db:5432/mycatatankuliah
      NATS_URL: nats://nats:4222
      HOCUSPOCUS_URL: http://hocuspocus:3005
      AI_SERVICE_URL: http://ai:3000
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      embedder:
        condition: service_started
      hocuspocus:
        condition: service_started
      ai:
        condition: service_started

  ai:
    image: ghcr.io/hilmoo/my-catatan-kuliah-ai
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mycatatankuliah
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_API_KEY: <LLM_API_KEY>
      LLM_MODEL: minimaxai/minimax-m2.7
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_started

  embedder:
    image: ghcr.io/hilmoo/my-catatan-kuliah-embedder
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mycatatankuliah
      NATS_URL: nats://nats:4222
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      CHUNK_SIZE: 500
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  hocuspocus:
    image: ghcr.io/hilmoo/my-catatan-kuliah-hocuspocus
    environment:
      PORT: 3005
      DATABASE_URL: postgres://postgres:postgres@db:5432/mycatatankuliah
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  postgres_data:
  nats_data:
  minio_data:
  redis_data:
