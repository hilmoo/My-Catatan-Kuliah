services:
  db:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.12-alpine
    command: -js -sd /data
    volumes:
      - nats_data:/data

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  apps:
    image: ghcr.io/hilmoo/my-catatan-kuliah-apps
    ports:
      - "8080:8080"
    environment:
      DOMAIN: ${DOMAIN}
      SECRET: ${SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL}
      HOCUSPOCUS_URL: ${HOCUSPOCUS_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
      embedder:
        condition: service_started
      hocuspocus:
        condition: service_started
      ai:
        condition: service_started

  ai:
    image: ghcr.io/hilmoo/my-catatan-kuliah-ai
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL}
      REDIS_URL: ${REDIS_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_started

  embedder:
    image: ghcr.io/hilmoo/my-catatan-kuliah-embedder
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHUNK_SIZE: ${CHUNK_SIZE}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

  hocuspocus:
    image: ghcr.io/hilmoo/my-catatan-kuliah-hocuspocus
    environment:
      PORT: ${HOCUSPOCUS_PORT}
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: ${NATS_URL}
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  postgres_data:
  nats_data:
  minio_data:
  redis_data:
